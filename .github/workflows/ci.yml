name: Rust and dictionary verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
      - run: python3 tools/build_data.py
      - run: cargo test --all-targets --locked --offline
        env:
          COMPACT_JAPANESE_DICTIONARY: ${{ github.workspace }}/data/dictionary.bin
      - run: python3 tools/verify.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: |
          python3 -m venv .reference
          .reference/bin/pip install cutlet==0.4.0 fugashi==1.3.3 unidic-lite==1.0.8 jaconv==0.3.4 mojimoji==0.0.13
          .reference/bin/python tools/verify.py --reference
      - uses: actions/upload-artifact@v4
        with:
          name: compact-japanese-${{ runner.os }}-${{ runner.arch }}
          path: |
            data/
            target/release/libcompact_japanese.*
